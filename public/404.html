<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Shivansh Chauhan</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#060A12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Static by design: GitHub Pages serves this file directly, outside the
         Vite bundle, so the palette below is a hand-copy of src/index.css @theme. -->
    <style>
      :root {
        --ink-950: #060a12;
        --line: #22304a;
        --chalk: #edf2f7;
        --slate: #93a1b7;
        --teal-400: #4fd6c2;
        --amber-400: #f2b457;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; background: var(--ink-950); color: var(--chalk);
        font-family: "Space Grotesk", system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 2rem;
      }
      main { max-width: 34rem; }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--slate);
      }
      .eyebrow span { color: var(--amber-400); }
      h1 {
        font-size: clamp(2.5rem, 7vw, 4rem); line-height: 1.05; font-weight: 700;
        letter-spacing: -0.02em; margin: 1.25rem 0 0;
      }
      h1 em { font-family: "Fraunces", Georgia, serif; color: var(--teal-400); font-weight: 500; }
      p { margin-top: 1.5rem; font-size: 1.05rem; line-height: 1.7; color: var(--slate); }
      a.cta {
        display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 2.25rem;
        border-radius: 999px; background: var(--teal-400); color: var(--ink-950);
        padding: 0.8rem 1.5rem; text-decoration: none;
        font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase; transition: background 0.2s;
      }
      a.cta:hover { background: var(--chalk); }
      a.cta:focus-visible { outline: 2px solid var(--teal-400); outline-offset: 3px; }
      hr { border: 0; border-top: 1px solid var(--line); margin-top: 2.5rem; }
      .foot {
        font-family: "IBM Plex Mono", monospace; font-size: 0.65rem;
        letter-spacing: 0.16em; text-transform: uppercase; color: var(--slate);
        margin-top: 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span>&#9670;</span> Error 404</p>
      <h1>That page <em>doesn&rsquo;t</em> resolve.</h1>
      <p>
        Which is the whole point of the site, really &mdash; a reference that leads nowhere
        should say so rather than quietly return something plausible.
      </p>
      <a class="cta" href="/">Back to the portfolio <span aria-hidden="true">&rarr;</span></a>
      <hr />
      <p class="foot">Shivansh Chauhan &middot; Data &amp; BI Analyst &middot; London, UK</p>
    </main>
  </body>
</html>
